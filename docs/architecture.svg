<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a4fb5"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#fff"/>

  <!-- Browser -->
  <rect x="20" y="40" width="250" height="230" rx="10" fill="#eef5ff" stroke="#3b6fb6" stroke-width="1.5"/>
  <text x="145" y="62" text-anchor="middle" font-weight="bold" fill="#1d3f73">Browser (client tier)</text>
  <text x="145" y="78" text-anchor="middle" font-size="11" fill="#555">Chromium · Firefox · WebKit</text>
  <rect x="45" y="92" width="200" height="78" rx="6" fill="#fff" stroke="#3b6fb6"/>
  <text x="145" y="113" text-anchor="middle" font-weight="bold">React 19 SPA</text>
  <text x="145" y="130" text-anchor="middle" font-size="11">React Router (HashRouter)</text>
  <text x="145" y="145" text-anchor="middle" font-size="11">AuthContext · Axios services</text>
  <text x="145" y="160" text-anchor="middle" font-size="11">Vite dev server :3000</text>
  <rect x="70" y="195" width="150" height="50" rx="6" fill="#fff" stroke="#3b6fb6"/>
  <text x="145" y="216" text-anchor="middle" font-weight="bold">localStorage</text>
  <text x="145" y="233" text-anchor="middle" font-size="11">"loggedUser" (JWT)</text>
  <line x1="145" y1="170" x2="145" y2="193" stroke="#333" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- Server -->
  <rect x="345" y="40" width="300" height="230" rx="10" fill="#eefaf0" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="495" y="62" text-anchor="middle" font-weight="bold" fill="#1d5a36">Application server (Node.js)</text>
  <text x="495" y="78" text-anchor="middle" font-size="11" fill="#555">Express 5 · :3001</text>
  <rect x="370" y="90" width="250" height="38" rx="6" fill="#fff" stroke="#2e8b57"/>
  <text x="495" y="106" text-anchor="middle" font-weight="bold">Routes /api/*</text>
  <text x="495" y="121" text-anchor="middle" font-size="11">users · user · articles · profiles · tags</text>
  <rect x="370" y="138" width="250" height="38" rx="6" fill="#fff" stroke="#2e8b57"/>
  <text x="495" y="154" text-anchor="middle" font-weight="bold">Middleware</text>
  <text x="495" y="169" text-anchor="middle" font-size="11">verifyToken (JWT) · errorHandler</text>
  <rect x="370" y="186" width="120" height="38" rx="6" fill="#fff" stroke="#2e8b57"/>
  <text x="430" y="202" text-anchor="middle" font-weight="bold">Controllers</text>
  <text x="430" y="217" text-anchor="middle" font-size="11">bcrypt · slugify</text>
  <rect x="500" y="186" width="120" height="38" rx="6" fill="#fff" stroke="#2e8b57"/>
  <text x="560" y="202" text-anchor="middle" font-weight="bold">Sequelize 6</text>
  <text x="560" y="217" text-anchor="middle" font-size="11">ORM models</text>
  <line x1="495" y1="128" x2="495" y2="136" stroke="#333" marker-end="url(#a)"/>
  <line x1="430" y1="176" x2="430" y2="184" stroke="#333" marker-end="url(#a)"/>
  <line x1="490" y1="205" x2="498" y2="205" stroke="#333" marker-end="url(#a)"/>
  <text x="495" y="252" text-anchor="middle" font-size="11" fill="#555">User · Article · Comment · Tag</text>

  <!-- DB -->
  <rect x="725" y="40" width="215" height="230" rx="10" fill="#fff6e8" stroke="#c07a12" stroke-width="1.5"/>
  <text x="832" y="62" text-anchor="middle" font-weight="bold" fill="#7a4b06">Database server</text>
  <ellipse cx="832" cy="105" rx="70" ry="14" fill="#fff" stroke="#c07a12"/>
  <path d="M762,105 v90 a70,14 0 0 0 140,0 v-90" fill="#fff" stroke="#c07a12"/>
  <text x="832" y="140" text-anchor="middle" font-weight="bold">PostgreSQL 18</text>
  <text x="832" y="157" text-anchor="middle" font-size="11">conduit_dev</text>
  <text x="832" y="230" text-anchor="middle" font-size="11">Users · Articles · Comments</text>
  <text x="832" y="245" text-anchor="middle" font-size="11">Tags · TagList · Favorites</text>
  <text x="832" y="260" text-anchor="middle" font-size="11">Followers</text>

  <!-- tier arrows -->
  <line x1="245" y1="131" x2="368" y2="109" stroke="#333" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="306" y="100" text-anchor="middle" font-size="11">HTTP / JSON</text>
  <text x="306" y="146" text-anchor="middle" font-size="11">Authorization:</text>
  <text x="306" y="160" text-anchor="middle" font-size="11">Token &lt;jwt&gt;</text>
  <line x1="620" y1="205" x2="760" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="690" y="200" text-anchor="middle" font-size="11">SQL</text>

  <!-- Test harness -->
  <rect x="20" y="320" width="920" height="130" rx="10" fill="#f5efff" stroke="#7a4fb5" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="480" y="342" text-anchor="middle" font-weight="bold" fill="#4b2a7a">Test harness: Playwright Test (Node.js)</text>
  <rect x="40" y="356" width="270" height="78" rx="6" fill="#fff" stroke="#7a4fb5"/>
  <text x="175" y="376" text-anchor="middle" font-weight="bold">Browser contexts (UI tests)</text>
  <text x="175" y="393" text-anchor="middle" font-size="11">locators · auto-wait · dialogs</text>
  <text x="175" y="408" text-anchor="middle" font-size="11">addInitScript → session injection</text>
  <text x="175" y="423" text-anchor="middle" font-size="11">page.route / setOffline → network faults</text>
  <rect x="345" y="356" width="270" height="78" rx="6" fill="#fff" stroke="#7a4fb5"/>
  <text x="480" y="376" text-anchor="middle" font-weight="bold">APIRequestContext</text>
  <text x="480" y="393" text-anchor="middle" font-size="11">fast set-up (register, create article)</text>
  <text x="480" y="408" text-anchor="middle" font-size="11">bypass client validation</text>
  <text x="480" y="423" text-anchor="middle" font-size="11">read-back = database verification</text>
  <rect x="650" y="356" width="270" height="78" rx="6" fill="#fff" stroke="#7a4fb5"/>
  <text x="785" y="376" text-anchor="middle" font-weight="bold">Reporters &amp; evidence</text>
  <text x="785" y="393" text-anchor="middle" font-size="11">HTML · JSON · JUnit</text>
  <text x="785" y="408" text-anchor="middle" font-size="11">screenshot · video · trace on failure</text>
  <text x="785" y="423" text-anchor="middle" font-size="11">scripts/summarize.js → pass rates</text>
  <line x1="175" y1="354" x2="145" y2="272" stroke="#7a4fb5" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#d)"/>
  <text x="185" y="300" font-size="11" fill="#4b2a7a">drives UI</text>
  <line x1="480" y1="354" x2="480" y2="272" stroke="#7a4fb5" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#d)"/>
  <text x="490" y="300" font-size="11" fill="#4b2a7a">HTTP to API</text>
</svg>
